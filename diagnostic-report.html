<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>F TO A Tutoring — Diagnostic Report Generator</title>
<script src="https://unpkg.com/docx@8.5.0/build/index.js"></script>
<script src="https://unpkg.com/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f0f4f8;
    color: #1a2744;
    min-height: 100vh;
  }

  /* ── Input panel ── */
  #input-panel {
    max-width: 860px;
    margin: 0 auto;
    padding: 40px 24px;
  }

  .panel-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
  }

  .logo-mark {
    background: #1a2744;
    border-radius: 10px;
    width: 48px; height: 48px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; color: #1C8FD6; font-size: 14px; letter-spacing: -1px;
  }

  .panel-header h1 { font-size: 22px; font-weight: 800; color: #1a2744; }
  .panel-header p  { font-size: 13px; color: #64748b; margin-top: 2px; }

  .card {
    background: white;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
    padding: 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }

  label { display: block; font-size: 13px; font-weight: 700; color: #1a2744; margin-bottom: 8px; }

  textarea {
    width: 100%;
    height: 260px;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 12px;
    resize: vertical;
    color: #1a2744;
    background: #f8fafc;
    outline: none;
    transition: border-color .2s;
  }
  textarea:focus { border-color: #1C8FD6; background: white; }

  .api-row {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    align-items: center;
  }

  .api-row input {
    flex: 1;
    font-size: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 10px 12px;
    color: #1a2744;
    background: #f8fafc;
    outline: none;
  }
  .api-row input:focus { border-color: #1C8FD6; background: white; }

  .btn {
    padding: 10px 24px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity .2s;
    white-space: nowrap;
  }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary { background: #1C8FD6; color: white; }
  .btn-primary:not(:disabled):hover { opacity: .88; }
  .btn-print { background: #1a2744; color: white; }
  .btn-print:hover { opacity: .85; }

  .footer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
  }

  #error-msg { color: #dc2626; font-size: 13px; }
  #status-msg { color: #64748b; font-size: 13px; font-style: italic; }

  /* ── Spinner ── */
  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,.4);
    border-top-color: white;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Report ── */
  #report-wrap {
    max-width: 860px;
    margin: 0 auto 60px;
    padding: 0 24px;
    display: none;
  }

  .report-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-bottom: 16px;
  }

  #report {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 56px 64px;
    box-shadow: 0 2px 12px rgba(0,0,0,.08);
    font-family: 'Times New Roman', Times, serif;
    color: #000;
    font-size: 13.5px;
    line-height: 1.6;
  }

  /* Logo area */
  .r-logo {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    margin-bottom: 32px;
  }

  .r-logo-text { text-align: left; }
  .r-logo-text .brand {
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 1px;
    line-height: 1;
  }
  .r-logo-text .brand span { color: #1C8FD6; }
  .r-logo-text .tagline {
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 3px;
    font-weight: 700;
    color: #1a2744;
    margin-top: 3px;
  }

  /* Report title */
  .r-title {
    text-align: center;
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 24px;
    line-height: 1.4;
  }

  /* Section headings */
  .r-section-title {
    text-align: center;
    font-weight: bold;
    text-decoration: underline;
    margin: 24px 0 12px;
    font-size: 14px;
  }

  .r-section-title-left {
    font-weight: bold;
    text-decoration: underline;
    margin: 24px 0 10px;
    font-size: 14px;
  }

  /* Tables */
  .r-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
    font-size: 13px;
  }
  .r-table th, .r-table td {
    border: 1px solid #000;
    padding: 9px 12px;
    vertical-align: top;
  }
  .r-table th {
    font-weight: bold;
    text-align: center;
  }
  .r-table .cell-center { text-align: center; }
  .r-table .cell-bold   { font-weight: bold; text-align: center; }

  /* Paragraphs */
  .r-para { margin-bottom: 12px; text-align: justify; }

  /* Lists */
  .r-ol { padding-left: 22px; margin-bottom: 12px; }
  .r-ol li { margin-bottom: 8px; }
  .r-ul { padding-left: 22px; margin-bottom: 12px; list-style: disc; }
  .r-ul li { margin-bottom: 8px; }
  .r-ul-circle { padding-left: 22px; margin-top: 6px; list-style: circle; }
  .r-ul-circle li { margin-bottom: 4px; }

  .bold { font-weight: bold; }
  .italic { font-style: italic; }

  /* ── Print ── */
  @media print {
    body { background: white; }
    #input-panel, .report-actions { display: none !important; }
    #report-wrap { display: block !important; padding: 0; margin: 0; max-width: none; }
    #report {
      border: none; border-radius: 0; box-shadow: none;
      padding: 40px 56px;
    }
  }
</style>
</head>
<body>

<!-- ════════════════════════════════════════════
     INPUT PANEL
════════════════════════════════════════════ -->
<div id="input-panel">
  <div class="panel-header">
    <div class="logo-mark">F→A</div>
    <div>
      <h1>Diagnostic Report Generator</h1>
      <p>Paste your Gemini / Google Meet session notes to generate a full assessment report</p>
    </div>
  </div>

  <div class="card">
    <label for="notes">Meeting Notes</label>
    <textarea id="notes" placeholder="Paste your meeting notes here (summary, details, next steps)…"></textarea>

    <div class="api-row">
      <input id="apikey" type="password" placeholder="Anthropic API key (sk-ant-…)" />
    </div>

    <div class="footer-row">
      <span id="error-msg"></span>
      <span id="status-msg"></span>
      <button class="btn btn-primary" id="gen-btn" onclick="generate()">Generate Report</button>
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════════
     REPORT OUTPUT
════════════════════════════════════════════ -->
<div id="report-wrap">
  <div class="report-actions">
    <button class="btn btn-print" onclick="window.print()">🖨 Print / Save PDF</button>
    <button class="btn btn-print" style="background:#1e6b3c" onclick="downloadDocx()">⬇ Download DOCX</button>
    <button class="btn btn-primary" onclick="resetForm()">← New Report</button>
  </div>
  <div id="report"></div>
</div>

<script>
// ── Hexagon SVG logo ──────────────────────────────────────
const LOGO_SVG = `
<svg width="70" height="70" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
  <polygon points="36,4 67,20 67,52 36,68 5,52 5,20" fill="#1a2744"/>
  <polygon points="36,10 61,24 61,48 36,62 11,48 11,24" fill="none" stroke="#1C8FD6" stroke-width="2.5"/>
  <ellipse cx="36" cy="40" rx="11" ry="9" fill="#F97316" opacity="0.95"/>
  <path d="M29 34 Q36 27 43 34 L43 40 Q36 33 29 40 Z" fill="white" opacity="0.65"/>
</svg>`

// ── Generate ──────────────────────────────────────────────
async function generate() {
  const notes  = document.getElementById('notes').value.trim()
  const apiKey = document.getElementById('apikey').value.trim()
  const btn    = document.getElementById('gen-btn')
  const errEl  = document.getElementById('error-msg')
  const stEl   = document.getElementById('status-msg')

  errEl.textContent = ''
  if (!notes)  { errEl.textContent = 'Please paste your meeting notes first.'; return; }
  if (!apiKey) { errEl.textContent = 'Please enter your Anthropic API key.'; return; }

  btn.disabled = true
  btn.innerHTML = '<span class="spinner"></span>Generating…'
  stEl.textContent = 'Calling Claude — this takes about 5–10 seconds…'

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 4096,
        system: SYSTEM_PROMPT,
        messages: [{ role: 'user', content: 'Convert these meeting notes:\n\n' + notes }]
      })
    })

    if (!response.ok) {
      const err = await response.json()
      throw new Error(err.error?.message ?? `HTTP ${response.status}`)
    }

    const json = await response.json()
    const text = json.content?.[0]?.text ?? ''

    // Strip any markdown fences Claude might wrap around JSON
    const clean = text.replace(/^```json\s*/i, '').replace(/^```\s*/i, '').replace(/```\s*$/,'').trim()
    const data  = JSON.parse(clean)

    renderReport(data)
    stEl.textContent = ''
  } catch (e) {
    errEl.textContent = 'Error: ' + e.message
    stEl.textContent  = ''
    btn.disabled = false
    btn.textContent = 'Generate Report'
  }
}

// ── Reset ─────────────────────────────────────────────────
function resetForm() {
  document.getElementById('report-wrap').style.display = 'none'
  document.getElementById('input-panel').style.display = 'block'
  document.getElementById('gen-btn').disabled = false
  document.getElementById('gen-btn').textContent = 'Generate Report'
}

// ── Render ────────────────────────────────────────────────
function renderReport(d) {
  window._reportData = d
  const el = document.getElementById('report')

  // Profile table rows
  const profileRows = [
    ['Name',                d.studentName,        'The focus of this intensive intervention.'],
    ['Level',               d.level,              'Intervention is strategically placed at the start of the crucial A-Level journey.'],
    ['School',              d.school,             'Aligning intervention with school curriculum pace and requirements.'],
    ['Consultation Date',   d.consultationDate,   'Early identification allows for proactive gap bridging before high-stakes exams.'],
    ['Academic Motivation', d.motivationRating,   d.motivationSignificance],
  ]

  const profileTableRows = profileRows.map(([f, det, sig], i) => `
    <tr>
      <td class="cell-bold">${f}</td>
      <td class="${i === 4 ? 'cell-bold' : 'cell-center'}">${det}</td>
      <td>${sig}</td>
    </tr>`).join('')

  // Performance gaps table
  const gapRows = (d.performanceGaps ?? []).map(g => `
    <tr>
      <td class="cell-bold">${g.subject}</td>
      <td class="cell-bold">${g.challenge}</td>
      <td>${g.context}</td>
    </tr>`).join('')

  // Diagnostic summary numbered list
  const summaryItems = (d.diagnosticSummary ?? []).map(s =>
    `<li><span class="bold">${s.title}</span> ${s.detail}</li>`).join('')

  // Prognosis — bold first sentence
  const progParts  = d.prognosis.split(/(?<=\.)\s+/)
  const progFirst  = progParts[0] ?? ''
  const progRest   = progParts.slice(1).join(' ')

  // Modules
  const modulesHtml = (d.modules ?? []).map(mod => {
    const items = (mod.items ?? []).map(item => {
      const subs = (item.subItems ?? []).map(s =>
        `<li><span class="bold">${s.label}:</span> ${s.detail}</li>`).join('')
      return `<li>
        <span class="bold">${item.label}:</span> ${item.detail}
        ${subs ? `<ul class="r-ul-circle">${subs}</ul>` : ''}
      </li>`
    }).join('')
    return `<h3 class="r-section-title-left">${mod.title}</h3>
    <ul class="r-ul">${items}</ul>`
  }).join('')

  // Logistics
  const logHtml = (d.logistics ?? []).map(l =>
    `<li><span class="bold">${l.label}:</span> ${l.detail}</li>`).join('')

  // Next steps
  const stepsHtml = (d.nextSteps ?? []).map(s =>
    `<li><span class="bold">${s.label}:</span> ${s.detail}</li>`).join('')

  // History paragraphs
  const histParas = (d.detailedHistory ?? '').split('\n').filter(Boolean)
    .map(p => `<p class="r-para">${p}</p>`).join('')

  el.innerHTML = `
    <!-- Logo -->
    <div class="r-logo">
      ${LOGO_SVG}
      <div class="r-logo-text">
        <div class="brand">F TO A <span>TUTORING</span></div>
        <div class="tagline">HELPING LEARNERS HELP THEMSELVES</div>
      </div>
    </div>

    <!-- Title -->
    <p class="r-title">Comprehensive Academic Assessment and Strategic Intervention Plan for ${d.studentName}</p>

    <!-- Student Profile -->
    <p class="r-section-title">Student Profile and Preliminary Assessment</p>
    <table class="r-table">
      <thead>
        <tr>
          <th style="width:22%">Field</th>
          <th style="width:22%">Detail</th>
          <th>Significance for Intervention</th>
        </tr>
      </thead>
      <tbody>${profileTableRows}</tbody>
    </table>

    <!-- Detailed History -->
    <p class="r-section-title">Detailed History and Academic Examination: Identifying Core Challenges</p>
    ${histParas}

    <!-- Performance Gaps -->
    <p class="r-section-title">Subject-Specific Performance Gaps</p>
    <table class="r-table">
      <thead>
        <tr>
          <th style="width:22%">Subject</th>
          <th style="width:28%">Core Challenge Identified</th>
          <th>Specific Symptoms &amp; Context</th>
        </tr>
      </thead>
      <tbody>${gapRows}</tbody>
    </table>

    <!-- Diagnostic Summary -->
    <p class="r-section-title">Comprehensive Diagnostic Summary: The Gaps Identified</p>
    <p class="r-para">The assessment reveals ${(d.diagnosticSummary ?? []).length} distinct type${(d.diagnosticSummary ?? []).length !== 1 ? 's' : ''} of learning gaps:</p>
    <ol class="r-ol">${summaryItems}</ol>
    <p class="r-para"><span class="bold">${progFirst}</span> ${progRest}</p>

    <!-- Strategy -->
    <p class="r-section-title-left">Strategic Plan of Action: ${d.strategyName}</p>
    <p class="r-para" style="padding-left:16px">${d.strategyIntro}</p>
    ${modulesHtml}

    <!-- Logistics -->
    <p class="r-section-title-left">Logistics &amp; Scheduling Parameters</p>
    <ul class="r-ul">${logHtml}</ul>

    <!-- Next Steps -->
    <p class="r-section-title-left">Follow-up and Next Steps: Activation Phase</p>
    <ol class="r-ol">${stepsHtml}</ol>
  `

  document.getElementById('input-panel').style.display = 'none'
  document.getElementById('report-wrap').style.display  = 'block'
  window.scrollTo({ top: 0, behavior: 'smooth' })
}

// ── System prompt ─────────────────────────────────────────
const SYSTEM_PROMPT = `You are an expert academic consultant for F TO A Tutoring. Convert raw diagnostic session meeting notes into a structured JSON report. Extract and elaborate professionally to produce a comprehensive academic assessment.

Return ONLY valid JSON — no markdown fences, no extra text. Schema:

{
  "studentName": "string",
  "level": "string",
  "school": "string",
  "consultationDate": "string",
  "motivationRating": "string e.g. 'Rated 9 out of 10 (Excellent)'",
  "motivationSignificance": "string — why this motivation level matters",
  "detailedHistory": "string — 2-3 paragraphs separated by newlines, third person, about the student background and why they sought support",
  "performanceGaps": [
    {
      "subject": "string — subject name and syllabus code if available",
      "challenge": "string — headline for the core challenge",
      "context": "string — detailed explanation of symptoms and context"
    }
  ],
  "diagnosticSummary": [
    {
      "title": "string — bold label e.g. 'Computer Science: The Logical Translation Gap.'",
      "detail": "string — explanation"
    }
  ],
  "prognosis": "string — 2-3 sentences starting with 'Prognosis and Confidence Level: Excellent.' or appropriate level",
  "strategyName": "string — plan name e.g. 'The AS Level Precision Strategy (AS-LPS)'",
  "strategyIntro": "string — 1-2 sentence intro to the strategy",
  "modules": [
    {
      "title": "string — e.g. 'Module 1: Computer Science Logic Mastery (Addressing Logical Translation & Exam Literacy)'",
      "items": [
        {
          "label": "string — bold item label",
          "detail": "string",
          "subItems": [{ "label": "string", "detail": "string" }]
        }
      ]
    }
  ],
  "logistics": [{ "label": "string", "detail": "string" }],
  "nextSteps": [{ "label": "string", "detail": "string" }]
}`

// ── Download DOCX ─────────────────────────────────────────
function downloadDocx() {
  if (!window._reportData) { alert('Generate a report first.'); return; }
  const d = window._reportData
  const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell,
          WidthType, AlignmentType, BorderStyle, HeadingLevel,
          NumberingFormat, convertInchesToTwip } = docx

  const BORDER = { style: BorderStyle.SINGLE, size: 6, color: '000000' }
  const ALL_BORDERS = { top: BORDER, bottom: BORDER, left: BORDER, right: BORDER }
  const NO_BORDER   = { style: BorderStyle.NONE, size: 0, color: 'FFFFFF' }
  const NO_BORDERS  = { top: NO_BORDER, bottom: NO_BORDER, left: NO_BORDER, right: NO_BORDER }

  function cell(text, opts = {}) {
    return new TableCell({
      borders: ALL_BORDERS,
      shading: opts.header ? { fill: 'F2F2F2' } : undefined,
      children: [new Paragraph({
        alignment: opts.center ? AlignmentType.CENTER : AlignmentType.LEFT,
        children: [new TextRun({ text: String(text), bold: !!opts.bold, size: 22 })]
      })]
    })
  }

  function heading(text) {
    return new Paragraph({
      alignment: AlignmentType.CENTER,
      spacing: { before: 280, after: 120 },
      children: [new TextRun({ text, bold: true, underline: {}, size: 24 })]
    })
  }

  function headingLeft(text) {
    return new Paragraph({
      spacing: { before: 280, after: 100 },
      children: [new TextRun({ text, bold: true, size: 24 })]
    })
  }

  function para(runs) {
    return new Paragraph({ spacing: { after: 160 }, children: runs })
  }

  function run(text, opts = {}) {
    return new TextRun({ text: String(text), bold: !!opts.bold, italics: !!opts.italic, size: 22 })
  }

  function bullet(runs, level = 0) {
    return new Paragraph({
      bullet: { level },
      spacing: { after: 80 },
      children: runs
    })
  }

  function numbered(runs, ref) {
    return new Paragraph({
      numbering: { reference: ref, level: 0 },
      spacing: { after: 80 },
      children: runs
    })
  }

  // Profile table
  const profileRows = [
    ['Name',                d.studentName,        'The focus of this intensive intervention.', false],
    ['Level',               d.level,              'Intervention is strategically placed at the start of the crucial A-Level journey.', false],
    ['School',              d.school,             'Aligning intervention with school curriculum pace and requirements.', false],
    ['Consultation Date',   d.consultationDate,   'Early identification allows for proactive gap bridging before high-stakes exams.', false],
    ['Academic Motivation', d.motivationRating,   d.motivationSignificance, true],
  ]

  const profileTable = new Table({
    width: { size: 100, type: WidthType.PERCENTAGE },
    rows: [
      new TableRow({ children: [
        cell('Field',                       { bold: true, center: true, header: true }),
        cell('Detail',                      { bold: true, center: true, header: true }),
        cell('Significance for Intervention',{ bold: true, center: true, header: true }),
      ]}),
      ...profileRows.map(([f, det, sig, detBold]) => new TableRow({ children: [
        cell(f,   { bold: true,  center: true }),
        cell(det, { bold: detBold, center: true }),
        cell(sig, { center: false }),
      ]}))
    ]
  })

  // Performance gaps table
  const gapTable = new Table({
    width: { size: 100, type: WidthType.PERCENTAGE },
    rows: [
      new TableRow({ children: [
        cell('Subject',                  { bold: true, center: true, header: true }),
        cell('Core Challenge Identified',{ bold: true, center: true, header: true }),
        cell('Specific Symptoms & Context',{ bold: true, center: true, header: true }),
      ]}),
      ...(d.performanceGaps ?? []).map(g => new TableRow({ children: [
        cell(g.subject,   { bold: true, center: true }),
        cell(g.challenge, { bold: true, center: true }),
        cell(g.context),
      ]}))
    ]
  })

  // Diagnostic summary numbered list
  const numRef = 'summaryList'
  const summaryItems = (d.diagnosticSummary ?? []).map(s =>
    numbered([run(s.title, { bold: true }), run(' ' + s.detail)], numRef))

  // Prognosis
  const progParts = d.prognosis.split(/(?<=\.)\s+/)
  const progPara  = para([run(progParts[0], { bold: true }), run(' ' + progParts.slice(1).join(' '))])

  // Modules
  const moduleSections = (d.modules ?? []).flatMap(mod => {
    const items = (mod.items ?? []).flatMap(item => {
      const subs = (item.subItems ?? []).map(s =>
        bullet([run(s.label + ': ', { bold: true }), run(s.detail)], 1))
      return [
        bullet([run(item.label + ': ', { bold: true }), run(item.detail)]),
        ...subs
      ]
    })
    return [headingLeft(mod.title), ...items]
  })

  // Logistics
  const logItems = (d.logistics ?? []).map(l =>
    bullet([run(l.label + ': ', { bold: true }), run(l.detail)]))

  // Next steps (numbered)
  const nsRef   = 'nextStepsList'
  const nsItems = (d.nextSteps ?? []).map(s =>
    numbered([run(s.label + ': ', { bold: true }), run(s.detail)], nsRef))

  // History
  const histParas = (d.detailedHistory ?? '').split('\n').filter(Boolean)
    .map(p => para([run(p)]))

  const doc = new Document({
    numbering: {
      config: [
        { reference: numRef, levels: [{ level: 0, format: NumberingFormat.DECIMAL, text: '%1.', alignment: AlignmentType.LEFT, style: { paragraph: { indent: { left: 360, hanging: 360 } } } }] },
        { reference: nsRef,  levels: [{ level: 0, format: NumberingFormat.DECIMAL, text: '%1.', alignment: AlignmentType.LEFT, style: { paragraph: { indent: { left: 360, hanging: 360 } } } }] },
      ]
    },
    sections: [{
      properties: { page: { margin: { top: convertInchesToTwip(1), bottom: convertInchesToTwip(1), left: convertInchesToTwip(1.2), right: convertInchesToTwip(1.2) } } },
      children: [
        // Logo placeholder
        new Paragraph({
          alignment: AlignmentType.CENTER,
          spacing: { after: 40 },
          children: [new TextRun({ text: '[INSERT F TO A TUTORING LOGO HERE]', bold: true, color: '1C8FD6', size: 24 })]
        }),
        new Paragraph({
          alignment: AlignmentType.CENTER,
          spacing: { after: 240 },
          children: [new TextRun({ text: 'HELPING LEARNERS HELP THEMSELVES', size: 18, color: '1a2744', bold: true })]
        }),

        // Title
        new Paragraph({
          alignment: AlignmentType.CENTER,
          spacing: { after: 200 },
          children: [new TextRun({ text: `Comprehensive Academic Assessment and Strategic Intervention Plan for ${d.studentName}`, bold: true, size: 26 })]
        }),

        // Student Profile
        heading('Student Profile and Preliminary Assessment'),
        profileTable,

        // Detailed History
        heading('Detailed History and Academic Examination: Identifying Core Challenges'),
        ...histParas,

        // Performance Gaps
        heading('Subject-Specific Performance Gaps'),
        gapTable,

        // Diagnostic Summary
        heading('Comprehensive Diagnostic Summary: The Gaps Identified'),
        para([run(`The assessment reveals ${(d.diagnosticSummary ?? []).length} distinct type${(d.diagnosticSummary ?? []).length !== 1 ? 's' : ''} of learning gaps:`)]),
        ...summaryItems,
        progPara,

        // Strategy
        headingLeft(`Strategic Plan of Action: ${d.strategyName}`),
        para([run(d.strategyIntro)]),
        ...moduleSections,

        // Logistics
        headingLeft('Logistics & Scheduling Parameters'),
        ...logItems,

        // Next Steps
        headingLeft('Follow-up and Next Steps: Activation Phase'),
        ...nsItems,
      ]
    }]
  })

  Packer.toBlob(doc).then(blob => {
    saveAs(blob, `Diagnostic_Report_${d.studentName.replace(/\s+/g,'_')}.docx`)
  })
}
</script>
</body>
</html>
